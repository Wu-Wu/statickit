name: build-tools

# Публикация: git tag vX.Y.Z -> сборка на нативных раннерах обеих арок ->
# мультиарх-манифест X.Y.Z (без v-префикса) и latest в docker.io/<DOCKERHUB_USER>/statickit,
# и зеркало в ghcr.io/<владелец>/<репа> (пуш встроенным GITHUB_TOKEN, секреты не нужны).
# digest манифеста печатается в Step Summary — его пином в целевом Dockerfile.
# GHCR: пуш идёт встроенным GITHUB_TOKEN из публичного репа — пакет наследует его
# публичную видимость (проверено анонимным pull). Приватным он был бы при пуше
# вручную под PAT вне репа — тогда включать public вручную.

on:
  push:
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch: {}

# Параллельные прогоны одного ref (два dispatch, reruns рядом) не должны
# перемывать друг другу мультиарх-манифесты: одна публикация на ref за раз,
# отменаrunning запрещена — дожидаемся, не бросая пуш на середине.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKERHUB_USER }}/statickit

jobs:
  build:
    permissions:
      packages: write   # пуш в ghcr под GITHUB_TOKEN
    strategy:
      fail-fast: false   # падение одной арки не отменяет вторую — в одном прогоне видно обе
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm   # нативный arm64, бесплатно для публичных репо
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push (native ${{ matrix.arch }})
        run: |
          # GHCR-путь обязан быть строчным; в языке выражений Actions нет toLower,
          # понижаем регистр в bash (GITHUB_REPOSITORY = "Owner/Repo")
          IMAGE_GHCR="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_REF_NAME#v}"
          [ "$TAG" = "$GITHUB_REF_NAME" ] || true
          if [ "$TAG" = "$GITHUB_REF" ]; then TAG="sha-${GITHUB_SHA::12}"; fi
          docker build --platform "linux/${{ matrix.arch }}" \
            -t "$IMAGE:$TAG-${{ matrix.arch }}" \
            -t "$IMAGE_GHCR:$TAG-${{ matrix.arch }}" .
          # на pull_request — только сборка (статус-чек для ветки); секреты
          # реестров PR от форка всё равно не получит, пуш не нужен
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            docker push "$IMAGE:$TAG-${{ matrix.arch }}"
            docker push "$IMAGE_GHCR:$TAG-${{ matrix.arch }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Compose multi-arch manifest
        run: |
          IMAGE_GHCR="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" = "$GITHUB_REF" ]; then TAG="sha-${GITHUB_SHA::12}"; fi
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools create \
            -t "$IMAGE_GHCR:$TAG" -t "$IMAGE_GHCR:latest" \
            "$IMAGE_GHCR:$TAG-amd64" "$IMAGE_GHCR:$TAG-arm64"
          {
            echo "## Итог"
            echo '```'
            docker buildx imagetools inspect "$IMAGE:$TAG"
            echo '```'
            echo '```'
            docker buildx imagetools inspect "$IMAGE_GHCR:$TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub Release по тегу: чтобы в /releases был виден тег и готовая шпаргалка,
  # как образ тянуть/пинить из обоих реестров.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # gh release create под GITHUB_TOKEN
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          IMAGE_GHCR="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_REF_NAME#v}"
          DH_DIGEST=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}')
          GH_DIGEST=$(docker buildx imagetools inspect "$IMAGE_GHCR:$TAG" --format '{{json .Manifest.Digest}}')
          JQ_V=$(sed -n 's/^ARG JQ_VERSION=//p' Dockerfile)
          CURL_V=$(sed -n 's/^ARG CURL_VERSION=//p' Dockerfile)
          XZ_V=$(sed -n 's/^ARG XZ_VERSION=//p' Dockerfile)
          OSSL_V=$(sed -n 's/^ARG OPENSSL_VERSION=//p' Dockerfile)
          # imagetools create собирает байт-идентичные манифест-листы, так что
          # digest обычно общий; на всякий случай печатаем оба при расхождении
          if [ "$DH_DIGEST" = "$GH_DIGEST" ]; then
            DIGEST_LINE="**digest:** \`${DH_DIGEST}\` (одинаков в обоих реестрах)"
          else
            DIGEST_LINE="**digest:** Docker Hub \`${DH_DIGEST}\`, GHCR \`${GH_DIGEST}\`"
          fi
          cat > notes.md <<EOF
          Статические \`jq ${JQ_V}\`, \`curl ${CURL_V}\` (OpenSSL ${OSSL_V}), \`xz ${XZ_V}\` — мультиарх amd64+arm64, ноль рантайм-зависимостей. В образе: \`/tools/{jq,curl,xz}\` + \`/tools/licenses/\`.

          ## Где образ

          ${DIGEST_LINE}

          | реестр | образ |
          |---|---|
          | Docker Hub | \`docker.io/${IMAGE}:${TAG}\` · \`docker.io/${IMAGE}:latest\` |
          | GHCR | \`${IMAGE_GHCR}:${TAG}\` · \`${IMAGE_GHCR}:latest\` |

          Страницы: [hub.docker.com/r/${IMAGE}/tags](https://hub.docker.com/r/${IMAGE}/tags) · [ghcr.io/${IMAGE_GHCR#ghcr.io/}](https://ghcr.io/${IMAGE_GHCR#ghcr.io/})
          EOF
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "statickit ${GITHUB_REF_NAME}" --notes-file notes.md --latest
          fi
